{% load static %}
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ProjectMatch{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/inpurple.css' %}?v=1.1">
</head>

<body>
  <!-- ✅ Use shared navbar partial here -->
  {% include "partials/navbar.html" with role=role|default:"guest" %}

  <main class="container py-4">
    <!-- Messages (Powered by SweetAlert2) -->
    {% if messages %}
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        {% for message in messages %}
          (function() {
            let icon = "info";
            const tag = "{{ message.tags|default:'info' }}";
            if (tag.includes('success')) icon = "success";
            else if (tag.includes('error') || tag.includes('danger')) icon = "error";
            else if (tag.includes('warning')) icon = "warning";
            
            Swal.fire({
              icon: icon,
              title: tag.includes('success') ? "Success!" : (icon === "error" ? "Oops!" : "Notification"),
              text: "{{ message|escapejs }}",
              showConfirmButton: false,
              timer: 2500,
              background: '#f9f6fb'
            });
          })();
        {% endfor %}
        
        // Intercept Logout clicks
        const logoutBtns = document.querySelectorAll('.pm-logout-btn');
        logoutBtns.forEach(btn => {
          btn.addEventListener('click', function(e) {
            e.preventDefault();
            const targetHref = this.href;
            Swal.fire({
              title: 'Ready to leave?',
              text: "You are about to securely log out of ProjectMatch.",
              icon: 'question',
              showCancelButton: true,
              confirmButtonColor: '#198754',
              cancelButtonColor: '#6c757d',
              confirmButtonText: 'Yes, log me out',
              background: '#f9f6fb'
            }).then((result) => {
              if (result.isConfirmed) {
                window.location.href = targetHref;
              }
            })
          });
        });
      });
    </script>
    {% else %}
    <!-- Even if no messages, ensure SweetAlert and the logout logic are available -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const logoutBtns = document.querySelectorAll('.pm-logout-btn');
        logoutBtns.forEach(btn => {
          btn.addEventListener('click', function(e) {
            e.preventDefault();
            const targetHref = this.href;
            Swal.fire({
              title: 'Ready to leave?',
              text: "You are about to securely log out of ProjectMatch.",
              icon: 'question',
              showCancelButton: true,
              confirmButtonColor: '#198754',
              cancelButtonColor: '#6c757d',
              confirmButtonText: 'Yes, log me out',
              background: '#f9f6fb',
              color: 'var(--pm-text-primary)'
            }).then((result) => {
              if (result.isConfirmed) {
                window.location.href = targetHref;
              }
            })
          });
        });
      });
    </script>
    {% endif %}

    <!-- Main page content -->
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Initialize tooltips
      var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
      var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl)
      })
    });
  </script>
</body>

</html>
